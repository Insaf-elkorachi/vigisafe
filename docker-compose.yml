services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hse
      POSTGRES_PASSWORD: hse
      POSTGRES_DB: hse_remontees
    ports:
      - "5433:5432"
    volumes:
      - hse_postgres_data:/var/lib/postgresql/data

volumes:
  hse_postgres_data:
